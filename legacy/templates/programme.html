<main class="main">
	<section class="promo-primary">
		<picture>
			<source srcset="/legacy/img/faq.jpg" media="(min-width: 992px)"/><img class="img--bg" src="/legacy/img/faq.jpg" alt="img"/>
		</picture>
		<div class="promo-primary__description"> <span></span></div>
		<div class="container">
			<div class="row">
				<div class="col-auto">
					<div class="align-container">
						<div class="align-container__item"><span class="promo-primary__pre-title"></span>
							<h1 class="promo-primary__title">{{{banner_title}}}</h1>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<section class="section storie-details">
		<div class="container">
			<div class="row">
				<div class="col-xl-8 offset-xl-2">
					<div class="storie-details__top">
						<div class="storie-details__img"><img class="img--bg" src="{{image}}" alt="{{title}}"/></div>
						<div class="storie-details__description">
							<div class="row align-items-center">
								<div class="col-md-4 text-center text-md-left">
									<h5 class="storie-details__name">{{title}}</h5>
								</div>
								<div class="col-md-4 text-center text-md-left"><span class="storie-details__donation"><strong></strong></span></div>
								<div class="col-md-4 text-center text-md-right"><a class="button button--filled" href="/donate">+ Donate</a></div>
							</div>
						</div>
					</div>






					{{{body}}}

					<div class="storie-details__details">
						<div class="row align-items-center">
							<div class="col-md-8">
								<div class="storie-details__tags">Category: {{{tags}}}</div>
							</div>
							<div class="col-md-4">
								<ul class="storie-details__socials">
									<li><a href="{{share_facebook}}" target="_blank" rel="noopener" aria-label="Share on Facebook"><i class="fa fa-facebook" aria-hidden="true"></i></a></li>
									<li><a href="{{share_twitter}}" target="_blank" rel="noopener" aria-label="Share on Twitter"><i class="fa fa-twitter" aria-hidden="true"></i></a></li>
									<li><a href="{{share_whatsapp}}" target="_blank" rel="noopener" aria-label="Share on WhatsApp"><i class="fa fa-whatsapp" aria-hidden="true"></i></a></li>
								</ul>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>




</main>
