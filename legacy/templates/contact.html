<main class="main">
	<section class="promo-primary">
		<picture>
			<source srcset="/legacy/img/contacts.jpg" media="(min-width: 992px)"/><img class="img--bg" src="/legacy/img/contacts.jpg" alt="img"/>
		</picture>
		<div class="promo-primary__description"> <span></span></div>
		<div class="container">
			<div class="row">
				<div class="col-auto">
					<div class="align-container">
						<div class="align-container__item"><span class="promo-primary__pre-title"></span>
							<h1 class="promo-primary__title"><span>Contact Us</span></h1>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<section class="section contacts">
		<div class="container">
			<div class="row offset-margin">
				<div class="col-sm-6 col-lg-3">
					<div class="icon-item">
						<div class="icon-item__img">
							<svg class="icon icon-item__icon">
								<use xlink:href="#location-pin"></use>
							</svg>
						</div>
						<div class="icon-item__text">
							<p>Adress: {{address}}</p>
						</div>
					</div>
				</div>
				<div class="col-sm-6 col-lg-3">
					<div class="icon-item">
						<div class="icon-item__img">
							<svg class="icon icon-item__icon">
								<use xlink:href="#phone-call"></use>
							</svg>
						</div>
						<div class="icon-item__text">
							<p>Phone: {{{phones_contact}}}</p>
						</div>
					</div>
				</div>
				<div class="col-sm-6 col-lg-3">
					<div class="icon-item">
						<div class="icon-item__img">
							<svg class="icon icon-item__icon">
								<use xlink:href="#envelope"></use>
							</svg>
						</div>
						<div class="icon-item__text">
							<p>Email: <a class="icon-item__link" href="mailto:{{email}}">{{email}}</a></p>
						</div>
					</div>
				</div>

				<div class="col-sm-6 col-lg-3">
					<div class="icon-item">
						<div class="icon-item__img">
							<svg class="icon icon-item__icon">
								<use xlink:href="#donation"></use>
							</svg>
						</div>
						<div class="icon-item__text">
							<H6>Donate Now</H6>
							{{{bank_contact}}}

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>


	<section class="section contacts no-padding-top">
		<div class="contacts-wrapper">
			<div class="container">
				<div class="row justify-content-end">
					<div class="col-xl-6">
						<form class="form message-form" {{{form_attrs}}}>
							<input type="hidden" name="_subject" value="New message from basefoundation.in"/>
							<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true"/>
							<h6 class="form__title">Send Message</h6><span class="form__text">{{form_note}}</span>
							<div class="row">
								<div class="col-lg-6">
									<input class="form__field" type="text" name="first-name" placeholder="First Name *" required="required"/>
								</div>
								<div class="col-lg-6">
									<input class="form__field" type="text" name="last-name" placeholder="Last Name *" required="required"/>
								</div>
								<div class="col-lg-6">
									<input class="form__field" type="email" name="email" placeholder="Email *" required="required"/>
								</div>
								<div class="col-lg-6">
									<input class="form__field" type="tel" name="phone-number" placeholder="Phone"/>
								</div>
								<div class="col-12">
									<textarea class="form__message form__field" name="message" placeholder="Message"></textarea>
								</div>
								<div class="col-12">
									<button class="form__submit" type="submit">Send Message</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

		<div class="contacts-wrapper__map"><div class="gmap_canvas"><iframe title="Base Foundation location map" loading="lazy" class="gmap_iframe" width="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?width=600&amp;height=400&amp;hl=en&amp;q={{map_query}}&amp;t=&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe></div><style>.mapouter{position:relative;text-align:right;width:100%;height:400px;}.gmap_canvas {overflow:hidden;background:none!important;width:100%;height:400px;}.gmap_iframe {height:400px!important;}</style></div>
	</section>


	<section class="bottom-background"></section>

</main>
