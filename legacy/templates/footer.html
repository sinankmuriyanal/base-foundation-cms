<footer class="footer">
  <div class="container">
    <div class="row">
      <div class="col-sm-6 col-lg-3">
        <div class="footer-logo">
          <a class="footer-logo__link" href="/"
            ><img class="footer-logo__img" src="/legacy/img/logo.png" alt="logo"
          /></a>
        </div>

        <ul class="footer-socials">{{{socials_footer}}}</ul>

      </div>
      <div class="col-sm-6 col-lg-3">
        <h4 class="footer__title">Contacts</h4>
        <div class="footer-contacts">
          <p class="footer-contacts__address">
            {{address}}
          </p>
          <p class="footer-contacts__phone">
            Phone:
            {{{phones_footer}}}
          </p>
          <p class="footer-contacts__mail">
            Email:
            <a href="mailto:{{email}}"
              >{{email}}</a
            >
          </p>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <h4 class="footer__title">Menu & Links</h4>

        <nav>
          <ul class="footer-menu">
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/">Home</a>
            </li>
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/blog">Blog</a>
            </li>
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/gallery">Gallery</a>
            </li>
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/about">About Us</a>
            </li>
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/contact"
                >COntact us</a
              >
            </li>
            <li class="footer-menu__item">
              <a class="footer-menu__link" href="/join"
                >Join with Us</a
              >
            </li>
          </ul>
        </nav>

      </div>
      <div class="col-sm-6 col-lg-3">
        <h4 class="footer__title">Donate</h4>
        <p>Support us to change the world</p>
        <a class="button footer__button button--filled" href="/donate"
          >Donate</a
        >
      </div>
    </div>
    <div class="row align-items-baseline">
      <div class="col-md-6">
        <p class="footer-copyright">
          © {{year}} BASE Foundation Website developed by MSKSolutions
        </p>
      </div>
      <div class="col-md-6">
        <div class="footer-privacy">
          <a class="footer-privacy__link" href="#"> </a
          ><span class="footer-privacy__divider"> </span
          ><a class="footer-privacy__link" href="#"> </a>
        </div>
      </div>
    </div>
  </div>
</footer>
