<main class="main">
  <section class="promo-primary">
    <picture>
      <source srcset="/legacy/img/gallery.jpg" media="(min-width: 992px)" />
      <img class="img--bg" src="/legacy/img/gallery.jpg" alt="img" />
    </picture>
    <div class="promo-primary__description"><span></span></div>
    <div class="container">
      <div class="row">
        <div class="col-auto">
          <div class="align-container">
            <div class="align-container__item">
              <span class="promo-primary__pre-title"></span>
              <h1 class="promo-primary__title">
                <span>Gallery</span> <span></span>
              </h1>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section gallery">
    <div class="container">
      <div class="row">
        <div class="col-12">

          <ul class="filter-panel">
{{{filters}}}
          </ul>

        </div>
      </div>
    </div>
    <div class="row no-gutters gallery-masonry">
{{{items}}}
  </div>
  </section>

</main>
